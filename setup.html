<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Say it setup</title><style>body{font:16px Arial,sans-serif;max-width:620px;margin:60px auto;padding:24px;color:#16211d}input,button{font:inherit;padding:12px;border:1px solid #ccc;border-radius:8px;width:100%;box-sizing:border-box}button{margin-top:12px;background:#16211d;color:white;cursor:pointer}</style></head><body><h1>Say it setup</h1><p>This connects this device to the Say it shared database.</p><label>Supabase URL</label><input id="url" value="https://oqnnjfmobnrnrfpimglln.supabase.co"><br><br><label>Supabase publishable key</label><input id="key" type="password" placeholder="Paste your sb_publishable_... key"><button onclick="go()">Connect and open Say it</button><script>function go(){const u=document.getElementById('url').value.trim(),k=document.getElementById('key').value.trim();if(!u||!k)return alert('Please enter the publishable key.');localStorage.setItem('sayit:cfg',JSON.stringify({url:u,key:k}));location.replace('./');}</script></body></html>
