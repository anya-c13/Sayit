function TableThought({t,me,reload}){const[open,setOpen]=useState(false),[r,setR]=useState('');const reacted=(t.reacted_by||[]).includes(me.id);return <Card style={{padding:17}}><div style={{fontSize:12,color:C.muted}}>{t.student_name} · {rel(t.created_at)}</div><div className="thought" style={{fontSize:20,margin:'8px 0 14px'}}>{t.text}</div><div style={{display:'flex',gap:8,flexWrap:'wrap'}}><Btn small tone={reacted?C.table:undefined} onClick={async()=>{await store.react(t.id,me.id,reacted);reload()}}>{reacted?'I wondered this too ✓':'I wondered this too'}</Btn><Btn small onClick={()=>setOpen(!open)}>{t.replies?.length?`${t.replies.length} follow-up${t.replies.length>1?'s':''}`:'Add a follow-up'}</Btn></div>{open&&<div style={{marginTop:13,borderLeft:'2px solid '+C.soft,paddingLeft:14}}>{(t.replies||[]).map(x=><div key={x.id} style={{marginBottom:10}}><div style={{fontSize:12,color:C.muted}}>{x.student_name}</div><div className="thought">{x.text}</div></div>)}<textarea value={r} onChange={e=>setR(e.target.value)} placeholder="Build on it, or say what you'd add." style={{width:'100%',minHeight:68,padding:10,border:'1px solid '+C.line,borderRadius:10}}/><div style={{marginTop:7}}><Btn small solid disabled={!r.trim()} onClick={async()=>{await store.reply(t.id,me.id,r.trim());setR('');reload()}}>Add it</Btn></div></div>}</Card>}
function Teacher({onSwitch}){const[k,setK]=useState(()=>ls('sayit:teacherClass')), [state,setState]=useState(null),[tab,setTab]=useState('live'),[name,setName]=useState(''),[code,setCode]=useState(''),[err,setErr]=useState(''),[draft,setDraft]=useState({});async function refresh(){if(!k)return;const c=await store.getClass(k.code),sh=await store.shape(c.id),[th,q,s]=await Promise.all([store.classThoughts(c.id),store.queue(c.id),store.students(c.id)]);setState({klass:c,...sh,thoughts:th,queue:q,students:s})}useEffect(()=>{if(!k)return;refresh();let stop=()=>{};store.getClass(k.code).then(c=>{if(c)stop=store.subscribe(c.id,refresh)});return()=>stop()},[k]);if(!k)return <div style={{maxWidth:460,margin:'40px auto'}}><h1>Start a class</h1><Card style={{padding:22,marginBottom:16}}><Field label="What's the class called?"><Input value={name} onChange={e=>setName(e.target.value)} placeholder="Designing for Influence"/><div style={{marginTop:16}}><Btn solid full onClick={async()=>{try{const c=await store.createClass(name);ls('sayit:teacherClass',c);setK(c)}catch(e){setErr(e.message)}}}>Create it</Btn></div></Field></Card><Card style={{padding:22}}><Field label="Or open a class you already made"><Input value={code} maxLength={6} onChange={e=>setCode(e.target.value.toUpperCase())} placeholder="ABC123"/><div style={{marginTop:14}}><Btn full disabled={code.length!==6} onClick={async()=>{const c=await store.getClass(code);if(c){ls('sayit:teacherClass',c);setK(c)}else setErr('No class with that code.')}}>Open it</Btn></div></Field>{err&&<div style={{color:C.now,marginTop:12}}>{err}</div>}</Card><div style={{textAlign:'center',marginTop:16}}><button onClick={onSwitch} style={{border:0,background:'transparent',color:C.muted}}>I'm a student</button></div></div>;if(!state)return <div style={{padding:60,textAlign:'center'}}>Loading…</div>;const live=state.thoughts.filter(t=>t.visibility==='now'),later=state.thoughts.filter(t=>t.visibility==='later'),groups=[];return <div><Card style={{ function Deck({state,refresh}){const[file,setFile]=useState(null),[outline,setOutline]=useState(''),[busy,setBusy]=useState(false),[err,setErr]=useState('');function useOutline(){const lines=outline.split('\n').map(x=>x.trim()).filter(Boolean);if(!lines.length)return;const topics=lines.map((x,i)=>({title:x,subtopics:[],anchors:[{label:x,text:x}]}));setBusy(true);store.setRunningOrder(state.klass.id,{lecture:'',topics,deckTitle:file?.name||'Lecture outline'}).then(refresh).catch(e=>setErr(e.message)).finally(()=>setBusy(false))}return <Card style={{padding:20}}><b>{state.topics.length?'Replace the running order':'Set up the class'}</b><div style={{fontSize:14,color:C.muted,lineHeight:1.45,margin:'6px 0 16px'}}>Upload the deck as a PDF, or type the outline. The stored anchors are then used to help students connect questions to the material.</div><input type="file" accept=".pdf,.txt,.md,.csv,.vtt,.srt,.json" onChange={e=>setFile(e.target.files?.[0]||null)} style={{display:'block',width:'100%',padding:12,border:'1px dashed '+C.line,borderRadius:10,marginBottom:12}}/>{file&&<div style={{fontSize:13,color:C.muted,marginBottom:10}}>{file.name}</div>}<textarea value={outline} onChange={e=>setOutline(e.target.value)} placeholder={'The CREATE funnel\nWhere a behaviour drops out\nReading a failing gate\nB = MAP and the action line'} style={{width:'100%',minHeight:150,padding:12,border:'1px solid '+C.line,borderRadius:10}}/><div style={{marginTop:12}}><Btn solid disabled={!outline.trim()||busy} onClick={useOutline}>{busy?'Saving…':'Use this outline'}</Btn></div>{err&&<div style={{color:C.now,fontSize:13,marginTop:10}}>{err}</div>}</Card>}
