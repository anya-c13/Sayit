<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Say it</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#edf0ee;color:#16211d;font:15px Arial,sans-serif}*{box-sizing:border-box}button,input,textarea,select{font:inherit}.wrap{max-width:1000px;margin:auto;padding:24px}.card{background:#fff;border:1px solid #e6eae7;border-radius:14px;padding:20px;margin:12px 0}.btn{padding:10px 14px;border:1px solid #d6dcd8;border-radius:9px;background:#fff;cursor:pointer}.primary{background:#16211d;color:#fff}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:14px}@media(max-width:700px){.grid{grid-template-columns:1fr}}textarea,input,select{width:100%;padding:12px;border:1px solid #d6dcd8;border-radius:9px;background:#fff}.muted{color:#77837d}.q{font:20px Georgia,serif;line-height:1.45}.tag{display:inline-block;padding:4px 9px;border-radius:99px;font-size:12px;margin-right:6px;background:#edf0ee}.tabs{display:flex;gap:6px;border-bottom:1px solid #d6dcd8;margin:18px 0;flex-wrap:wrap}.tabs button{border:0;background:none;padding:10px 12px;cursor:pointer}.tabs .on{border-bottom:2px solid #16211d;font-weight:600}</style></head><body><div id="app"></div><script>
const C={now:'#b24a18',later:'#1f5b9e',table:'#2f6b47',private:'#5d6b78'},$=id=>document.getElementById(id);const ls=(k,v)=>v===undefined?JSON.parse(localStorage.getItem(k)||'null'):(v===null?localStorage.removeItem(k):localStorage.setItem(k,JSON.stringify(v)));const uid=p=>p+'_'+Math.random().toString(36).slice(2,9);const code=()=>{let a='ABCDEFGHJKLMNPQRSTUVWXYZ23456789',s='';for(let i=0;i<6;i++)s+=a[Math.random()*a.length|0];return s};let cfg=ls('sayit:cfg')||{url:'',key:''},sb=null;if(cfg.url&&cfg.key)try{sb=supabase.createClient(cfg.url,cfg.key)}catch(e){}
function Store(){return{cloud:!!sb,async getClass(c){if(sb){let r=await sb.from('classes').select('*').eq('code',c.toUpperCase()).maybeSingle();if(r.error)throw r.error;return r.data}let d=ls('sayit:solo')||{};return d.klass?.code===c.toUpperCase()?d.klass:null},async createClass(name){if(sb){let teacher_key=uid('k'),r=await sb.from('classes').insert({code:code(),teacher_key,name,status:'idle'}).select().single();if(r.error)throw r.error;await sb.from('tables_').insert([1,2,3,4].map(n=>({class_id:r.data.id,name:'Table '+n})));return r.data}let d={klass:{id:uid('c'),code:code(),name,status:'idle',current_topic_id:null},tables:[1,2,3,4].map(n=>({id:uid('t'),name:'Table '+n})),students:[],thoughts:[],queue:[],topics:[]};ls('sayit:solo',d);return d.klass},async tables(id){if(sb){let r=await sb.from('tables_').select('*').eq('class_id',id);if(r.error)throw r.error;return r.data}return (ls('sayit:solo')||{}).tables||[]},async join(id,name,table_id){if(sb){let r=await sb.from('students').insert({class_id:id,name,table_id}).select().single();if(r.error)throw r.error;return r.data}let d=ls('sayit:solo');let s={id:uid('s'),class_id:id,name,table_id};d.students.push(s);ls('sayit:solo',d);return s},async students(id){if(sb){let r=await sb.from('students').select('*').eq('class_id',id);if(r.error)throw r.error;return r.data}return(ls('sayit:solo')||{}).students||[]},async thoughts(id){if(sb){let r=await sb.from('thoughts').select('*,students(name)').eq('class_id',id).order('created_at',{ascending:false});if(r.error)throw r.error;return r.data}return(ls('sayit:solo')||{}).thoughts||[]},async send(x){if(sb){let r=await sb.from('thoughts').insert(x).select().single();if(r.error)throw r.error;if(x.visibility==='later')await sb.from('queue').insert({thought_id:r.data.id,class_id:x.class_id,status:'pending'});return r.data}let d=ls('sayit:solo'),t={...x,id:uid('q'),status:x.visibility==='now'?'ready':'captured',created_at:new Date().toISOString()};d.thoughts.unshift(t);if(x.visibility==='later')d.queue.push({thought_id:t.id,status:'pending'});ls('sayit:solo',d);return t},async queue(id){if(sb){let r=await sb.from('queue').select('*').eq('class_id',id);if(r.error)throw r.error;return r.data}return(ls('sayit:solo')||{}).queue||[]},async update(id,p){if(sb){let r=await sb.from('thoughts').update(p).eq('id',id);if(r.error)throw r.error}else{let d=ls('sayit:solo');d.thoughts=d.thoughts.map(t=>t.id===id?{...t,...p}:t);ls('sayit:solo',d)}},async classPatch(id,p){if(sb){let r=await sb.from('classes').update(p).eq('id',id);if(r.error)throw r.error}else{let d=ls('sayit:solo');d.klass={...d.klass,...p};ls('sayit:solo',d)}},subscribe(id,fn){if(!sb)return()=>{};let ch=sb.channel('sayit-'+id).on('postgres_changes',{event:'*',schema:'public',table:'thoughts',filter:'class_id=eq.'+id},fn).on('postgres_changes',{event:'*',schema:'public',table:'classes',filter:'id=eq.'+id},fn).on('postgres_changes',{event:'*',schema:'public',table:'students',filter:'class_id=eq.'+id},fn).on('postgres_changes',{event:'*',schema:'public',table:'queue',filter:'class_id=eq.'+id},fn).subscribe();return()=>sb.removeChannel(ch)}}}const st=Store();
function Header({role}){return `<header class="card" style="margin:0;border-radius:0;border-width:0 0 1px"><div style="max-width:1000px;margin:auto;display:flex;align-items:center;gap:10px"><b>Say it</b>${role?`<span class="tag">${role}</span>`:''}<span class="tag">${st.cloud?'live · synced':'solo · this device'}</span><span style="margin-left:auto">${role?`<button class="btn" onclick="window.setRole(null)">Switch role</button>`:''}<button class="btn" onclick="settings()">Settings</button></span></div></header>`}
async function settings(){let u=prompt('Supabase URL',cfg.url),k=prompt('Supabase anon key',cfg.key);if(u!==null&&k!==null){cfg={url:u.trim(),key:k.trim()};ls('sayit:cfg',cfg);location.reload()}}
function shell(role,body){$('app').innerHTML=Header({role})+`<main class="wrap">${body}</main>`}window.setRole=r=>{if(r)ls('sayit:role',r);else ls('sayit:role',null);location.reload()};
async function teacher(){let k=ls('sayit:teacher');if(!k){shell('teacher',`<h1>Start a class</h1><div class="card"><label>What's the class called?</label><input id="cn" placeholder="Designing for Influence"><p><button class="btn primary" onclick="makeClass()">Create it</button></p></div><div class="card"><label>Open an existing class</label><input id="oc" maxlength="6" placeholder="ABC123"><p><button class="btn" onclick="openClass()">Open it</button></p></div>`);return}let c=await st.getClass(k.code);if(!c){ls('sayit:teacher',null);return teacher()}renderTeacher(c)}window.makeClass=async()=>{let k=await st.createClass($('cn').value||'Class');ls('sayit:teacher',k);teacher()};window.openClass=async()=>{let k=await st.getClass($('oc').value);if(k){ls('sayit:teacher',k);teacher()}else alert('No class with that code.')};
async function renderTeacher(c){let [ts,qs,ss]=await Promise.all([st.thoughts(c.id),st.queue(c.id),st.students(c.id)]),live=ts.filter(x=>x.visibility==='now'),later=ts.filter(x=>x.visibility==='later');shell('teacher',`<div class="card"><div class="muted">${c.status==='live'?'● In session':'Not started'}</div><h1>${c.name}</h1><div class="q">Class code: <b>${c.code}</b></div><p><button class="btn primary" onclick="toggleSession('${c.id}','${c.status}')">${c.status==='live'?'End the session':'Start the session'}</button> <span class="muted">${ss.length} joined</span></p></div><div class="tabs"><button class="on">Live · ${live.length}</button><button>Later · ${later.length}</button></div>${live.length?live.map(t=>`<div class="card"><span class="tag">Say now</span><span class="tag">${t.students?.name||'Someone'}</span><div class="q">${esc(t.text)}</div><p><button class="btn primary" onclick="take('${t.id}','${c.id}')">${t.status==='taking'?'Mark addressed':'Take now'}</button> <button class="btn" onclick="laterize('${t.id}','${c.id}')">Save for later</button></p></div>`).join(''):`<div class="card muted">Nothing ready yet. Questions appear here when students choose “Say now”.</div>`}${later.map(t=>`<div class="card"><span class="tag">Later</span><span class="tag">${t.students?.name||'Someone'}</span><div class="q">${esc(t.text)}</div></div>`).join('')}<div class="card"><h3>Share with students</h3><div class="muted">Send them this page and class code <b>${c.code}</b>.</div></div>`);if(st.cloud)st.subscribe(c.id,()=>renderTeacher(c))}
window.toggleSession=async(id,s)=>{await st.classPatch(id,{status:s==='live'?'ended':'live'});teacher()};window.take=async(id,c)=>{let t=(await st.thoughts(c)).find(x=>x.id===id);await st.update(id,{status:t.status==='taking'?'addressed':'taking'});teacher()};window.laterize=async(id,c)=>{await st.update(id,{visibility:'later',status:'captured'});teacher()};
async function student(){let sess=ls('sayit:session');if(!sess){shell('student',`<h1>Join your class</h1><div class="card"><label>Class code</label><input id="jc" maxlength="6" placeholder="ABC123"><p><button class="btn primary" onclick="findClass()">Find the class</button></p><div id="join"></div></div>`);return}let c=await st.getClass(sess.code);if(!c){ls('sayit:session',null);return student()}renderStudent(c,sess)}window.findClass=async()=>{let c=await st.getClass($('jc').value);if(!c)return alert('No class with that code.');let tb=await st.tables(c.id);$('join').innerHTML=`<p><label>Your name</label><input id="jn" placeholder="Your name"></p><p><label>Table</label><select id="jt">${tb.map(t=>`<option value="${t.id}">${t.name}</option>`).join('')}</select></p><button class="btn primary" onclick="joinClass('${c.code}','${c.id}')">Join</button>`};window.joinClass=async(code,id)=>{let s=await st.join(id,$('jn').value,$('jt').value);ls('sayit:session',{code,student:s});student()};
async function renderStudent(c,sess){let ts=await st.thoughts(c.id),mine=ts.filter(t=>t.student_id===sess.student.id);shell('student',`<div class="card"><div class="muted">${c.status==='live'?'● In session':'Not started'}</div><h1>${c.name}</h1><div class="q">Capture what is in your head.</div></div><div class="card"><h2>What's in your head?</h2><textarea id="qt" rows="6" placeholder="Why does this work differently here?"></textarea><p><button class="btn" style="border-left:4px solid ${C.now}" onclick="sendQ('${c.id}','now')">Say now</button> <button class="btn" style="border-left:4px solid ${C.later}" onclick="sendQ('${c.id}','later')">Ask later</button> <button class="btn" style="border-left:4px solid ${C.table}" onclick="sendQ('${c.id}','table')">Share with table</button> <button class="btn" style="border-left:4px solid ${C.private}" onclick="privateQ()">Keep private</button></p></div><div class="card"><h3>My questions</h3>${mine.length?mine.map(t=>`<div style="padding:12px 0;border-top:1px solid #e6eae7"><span class="tag">${t.visibility}</span><div class="q">${esc(t.text)}</div></div>`).join(''):'<span class="muted">Nothing yet today.</span>'}</div>`);if(st.cloud)st.subscribe(c.id,()=>renderStudent(c,sess))}window.sendQ=async(id,v)=>{let s=ls('sayit:session'),text=$('qt').value.trim();if(!text)return;await st.send({class_id:id,student_id:s.student.id,table_id:s.student.table_id,text,visibility:v});$('qt').value='';alert(v==='now'?'Marked ready. The teacher knows it is coming.':v==='later'?'Saved for after class.':'Shared with your table.');student()};window.privateQ=()=>{let s=ls('sayit:session'),a=ls('sayit:private:'+s.code)||[],text=$('qt').value.trim();if(text){a.unshift({text,visibility:'private',created_at:new Date().toISOString()});ls('sayit:private:'+s.code,a);$('qt').value='';alert('Kept private on this device.')}};function esc(s){return String(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
(async()=>{let r=ls('sayit:role');if(!r){shell(null,`<div style="max-width:620px;margin:60px auto;text-align:center"><h1>What brings you here?</h1><p class="muted">Choose your screen to get started.</p><div class="grid"><button class="card" onclick="setRole('teacher')"><h2>I'm a teacher</h2><span class="muted">Start a class and see questions live.</span></button><button class="card" onclick="setRole('student')"><h2>I'm a student</h2><span class="muted">Join a class and choose who sees your question.</span></button></div></div>`)}else r==='teacher'?teacher():student()})();
</script></body></html>
